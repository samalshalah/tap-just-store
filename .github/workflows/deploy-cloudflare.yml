name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check Cloudflare token
        if: env.HAS_CLOUDFLARE_API_TOKEN != 'true'
        shell: bash
        run: |
          echo "::notice::Cloudflare deploy is ready, but CLOUDFLARE_API_TOKEN is not set yet. Add it as a GitHub repository secret, then rerun this workflow."

      - name: Checkout
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Set up Node
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        run: pnpm typecheck

      - name: Build OpenNext Worker
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        run: pnpm opennextjs-cloudflare build

      - name: Prepare deploy bundle
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        run: pnpm wrangler deploy .open-next/worker.js --dry-run --outdir wrangler-dryrun

      - name: Patch deploy bundle
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        run: node scripts/patch-cloudflare-worker.mjs wrangler-dryrun/worker.js

      - name: Upload Worker version
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          pnpm wrangler versions upload wrangler-dryrun/worker.js --no-bundle --message "GitHub deploy ${GITHUB_SHA}" | tee wrangler-upload.log
          version_id="$(grep -Eo 'Worker Version ID: [a-f0-9-]+' wrangler-upload.log | awk '{print $4}' | tail -n1)"
          if [ -z "$version_id" ]; then
            echo "::error::Could not find uploaded Worker Version ID."
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker version
        if: env.HAS_CLOUDFLARE_API_TOKEN == 'true'
        run: pnpm wrangler versions deploy "${{ steps.upload.outputs.version_id }}" --yes
